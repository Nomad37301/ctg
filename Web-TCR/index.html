<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TecArt CTF</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', monospace;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 4rem;
      max-width: 680px;
    }

    header {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: normal;
      line-height: 1.4;
      margin-bottom: 1.5rem;
    }

    p {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #444;
      margin-bottom: 1rem;
    }

    .hint {
      margin-top: 2.5rem;
      padding-top: 2rem;
      border-top: 1px solid #ccc;
      font-size: 0.85rem;
      color: #888;
    }

    .hint span {
      color: #1a1a1a;
      font-style: italic;
    }

    footer {
      margin-top: 4rem;
      font-size: 0.75rem;
      color: #bbb;
    }
  </style>
</head>
<body>

  <!-- FLAG: tecart{y0u_f0und_m3_1n_th3_s0urc3_c0d3} -->

  <p>Kamu sudah sampai di sini. Bagus.</p>

  <p>
    Di suatu tempat di halaman ini tersembunyi sebuah flag.
    Bukan di layar — tapi kamu sudah di jalur yang benar.
  </p>

  <p>Formatnya: <code>tecart{...}</code></p>
